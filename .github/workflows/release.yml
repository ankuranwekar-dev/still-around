name: Build desktop apps

# The Mac build has to run on a Mac and the Windows build has to run on Windows:
# electron-builder can cross-compile a bare directory, but not a DMG or an NSIS
# installer, so each one is built on its own runner. Tagging a version is the
# whole release process.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: mac
          - os: windows-latest
            script: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The icons are generated from the engine rather than committed as binaries.
      # iconutil is macOS-only, so the .icns only appears on that runner — which is
      # the only runner that needs it.
      - run: node tools/make-icons.js

      # A quick check that the engine still renders before spending time packaging.
      - run: node tools/sheet.js sheet.png

      - run: npx playwright install chromium
        if: runner.os == 'macOS'

      - run: node tools/shot3d.js --gl swiftshader --sheet morphs morphs.png
        if: runner.os == 'macOS'

      - run: node tools/perf3d.js --gl swiftshader --budget 50
        if: runner.os == 'macOS'

      # Signing and notarization for macOS. All five are "magic" names
      # electron-builder reads directly from the environment — nothing in
      # package.json has to reference them. CSC_IDENTITY_AUTO_DISCOVERY is
      # deliberately *not* set: setting it to false, even alongside a real
      # CSC_LINK, makes electron-builder skip signing entirely (a known
      # electron-builder bug, electron-userland/electron-builder#7515) — it
      # cost a build finding that out. Hardened runtime and the entitlements
      # notarization needs are already on by default for a Developer ID
      # (non-Mac-App-Store) build, so nothing to add there either. Windows
      # code-signing is a separate certificate from a different CA and isn't
      # set up — the Windows build stays unsigned for now.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The .pet file association is what makes double-clicking a saved pet
      # actually open the app — the whole point of the file. electron-builder
      # writes it from `build.fileAssociations` in package.json into the NSIS
      # script at pack time; this installs the freshly built .exe silently on
      # the runner itself and checks the registry key actually landed, rather
      # than trusting that step ran correctly. perMachine is false, so a
      # per-user install registers under HKCU, not HKLM.
      - name: Verify the installer registers .pet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          Write-Host "Installing $($installer.Name) silently..."
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait

          $assoc = Get-ItemProperty -Path 'HKCU:\Software\Classes\.pet' -ErrorAction Stop
          $progId = $assoc.'(default)'
          if ([string]::IsNullOrEmpty($progId)) {
            throw "HKCU:\Software\Classes\.pet exists but has no ProgID set"
          }
          Write-Host "Registered .pet -> $progId"

      - uses: actions/upload-artifact@v4
        with:
          name: still-around-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
          draft: true
          body: |
            Download the build for your machine below, then open the `.pet`
            file you saved from the website — double-clicking it opens Still
            Around directly.

            The macOS build is signed and notarized, so it opens normally. The
            Windows build is not code-signed yet — choose "More info" then
            "Run anyway" if SmartScreen appears.
