name: Build desktop apps

# The Mac build has to run on a Mac and the Windows build has to run on Windows:
# electron-builder can cross-compile a bare directory, but not a DMG or an NSIS
# installer, so each one is built on its own runner. Tagging a version is the
# whole release process.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: mac
          - os: windows-latest
            script: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The icons are generated from the engine rather than committed as binaries.
      # iconutil is macOS-only, so the .icns only appears on that runner — which is
      # the only runner that needs it.
      - run: node tools/make-icons.js

      # A quick check that the engine still renders before spending time packaging.
      - run: node tools/sheet.js sheet.png

      - run: npx playwright install chromium
        if: runner.os == 'macOS'

      - run: node tools/shot3d.js --gl swiftshader --sheet morphs morphs.png
        if: runner.os == 'macOS'

      - run: node tools/perf3d.js --gl swiftshader --budget 50
        if: runner.os == 'macOS'

      # Signing only, here — notarization is a separate step below. CSC_LINK
      # and CSC_KEY_PASSWORD are "magic" names electron-builder reads
      # directly from the environment; nothing in package.json references
      # them. CSC_IDENTITY_AUTO_DISCOVERY is deliberately *not* set: setting
      # it to false, even alongside a real CSC_LINK, makes electron-builder
      # skip signing entirely (a known electron-builder bug,
      # electron-userland/electron-builder#7515) — it cost a build finding
      # that out. Hardened runtime and the entitlements notarization needs
      # are already on by default for a Developer ID (non-Mac-App-Store)
      # build, so nothing to add there either. Windows code-signing is a
      # separate certificate from a different CA and isn't set up — the
      # Windows build stays unsigned for now.
      #
      # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are deliberately
      # NOT passed here. If they were, electron-builder would try to
      # auto-notarize as part of this step by calling `notarytool submit
      # --wait` — and that specific combination is a documented way for the
      # whole step to hang for hours with zero log output
      # (electron/notarize#179). Hit twice in a row on this exact build, so
      # it is this environment's normal behaviour, not bad luck. Signing
      # still happens here; notarizing happens by hand next, without --wait.
      - run: npm run ${{ matrix.script }}
        timeout-minutes: 15
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Submits without --wait — confirmed elsewhere to return in a couple of
      # minutes rather than hang — and polls status in a loop this step
      # controls, so progress is visible in the log line by line instead of
      # one opaque blocking call.
      #
      # Two things get notarized and stapled here, not one, and the difference
      # matters. Stapling only the DMG (the previous version of this step) left
      # Gatekeeper needing an online call to Apple the first time anyone actually
      # launched the app — because the staple lives on the DMG container, and it
      # does not travel with the .app when someone drags it out to /Applications,
      # which is the whole point of a DMG. Checked directly on a shipped build:
      # `stapler validate` on the extracted .app reported no ticket at all. A
      # user opening it offline, or from a machine with a firewall between it and
      # Apple, would have been blocked on first launch with no warning this could
      # happen. So the .app is notarized and stapled *first*, and the DMG is then
      # rebuilt around that already-stapled .app with plain hdiutil rather than
      # by re-running electron-builder — asking electron-builder to package a
      # second time risks it re-signing (undoing the staple) or picking a
      # different identity, and the DMG layout here is simple enough (one app,
      # one Applications symlink) not to need it. The rebuilt DMG is notarized
      # and stapled too, so mounting it never prompts either — belt and braces,
      # and cheap, since everything inside it already carries a valid ticket.
      - name: Notarize and staple
        if: runner.os == 'macOS'
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e

          # Submits $1, polls until it leaves "In Progress", prints the notary
          # log and fails the step on anything but Accepted. Used for the .app
          # zip and the rebuilt DMG in turn.
          notarize () {
            local target="$1"
            echo "Submitting $target for notarization (not waiting on notarytool itself — that's the part that hangs)..."
            local submit_out submission_id status info
            submit_out=$(xcrun notarytool submit "$target" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --output-format json)
            echo "$submit_out"
            submission_id=$(echo "$submit_out" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "submission id: $submission_id"

            status="In Progress"
            for i in $(seq 1 80); do
              sleep 20
              info=$(xcrun notarytool info "$submission_id" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                --output-format json)
              status=$(echo "$info" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              echo "check $i ($((i * 20 / 60)) min): $status"
              if [ "$status" != "In Progress" ]; then break; fi
            done

            if [ "$status" != "Accepted" ]; then
              echo "Notarization did not succeed: $status"
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
          }

          APP="release/mac-universal/Still Around.app"
          OLD_DMG=$(ls release/*.dmg | head -1)

          echo "--- stage 1: the .app itself, so the staple travels when it is copied out of the DMG ---"
          ditto -c -k --keepParent "$APP" /tmp/app-for-notary.zip
          notarize /tmp/app-for-notary.zip
          echo "Stapling the notarization ticket onto the .app..."
          xcrun stapler staple "$APP"

          echo "--- rebuilding the DMG around the now-stapled .app ---"
          # electron-builder is not re-run: doing that risks re-signing the .app,
          # which would silently discard the staple just applied above. The
          # layout is simple enough (the app, plus a symlink so dragging it to
          # Applications works) to reassemble directly.
          rm -rf /tmp/dmg-root && mkdir -p /tmp/dmg-root
          cp -R "$APP" /tmp/dmg-root/
          ln -s /Applications /tmp/dmg-root/Applications
          rm -f "$OLD_DMG" "$OLD_DMG.blockmap"
          hdiutil create -volname "Still Around" -srcfolder /tmp/dmg-root -ov -format UDZO "$OLD_DMG"

          echo "--- stage 2: the DMG container, so mounting it never has to ask Apple either ---"
          notarize "$OLD_DMG"
          echo "Stapling the notarization ticket onto the DMG..."
          xcrun stapler staple "$OLD_DMG"
          echo "done"

      # The .pet file association is what makes double-clicking a saved pet
      # actually open the app — the whole point of the file. electron-builder
      # writes it from `build.fileAssociations` in package.json into the NSIS
      # script at pack time; this installs the freshly built .exe silently on
      # the runner itself and checks the registry key actually landed, rather
      # than trusting that step ran correctly. perMachine is false, so a
      # per-user install registers under HKCU, not HKLM.
      - name: Verify the installer registers .pet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          Write-Host "Installing $($installer.Name) silently..."
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait

          $assoc = Get-ItemProperty -Path 'HKCU:\Software\Classes\.pet' -ErrorAction Stop
          $progId = $assoc.'(default)'
          if ([string]::IsNullOrEmpty($progId)) {
            throw "HKCU:\Software\Classes\.pet exists but has no ProgID set"
          }
          Write-Host "Registered .pet -> $progId"

      - uses: actions/upload-artifact@v4
        with:
          name: still-around-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
          draft: true
          body: |
            Download the build for your machine below, then open the `.pet`
            file you saved from the website — double-clicking it opens Still
            Around directly.

            The macOS build is signed and notarized, so it opens normally. The
            Windows build is not code-signed yet — choose "More info" then
            "Run anyway" if SmartScreen appears.
