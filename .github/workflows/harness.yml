# 3D harness on pull requests. The Mac runner has SwiftShader; the 8ms overlay
# budget is measured on real GPU locally via `npm run perf3d`.

name: Harness

on:
  pull_request:
  push:
    branches: [main]

# A fork's pull request runs this workflow with a read-only token by default —
# that is what already keeps the release secrets unreachable from an outside PR.
# This says so explicitly, so a later edit that adds a step needing write access
# fails loudly asking for permission, rather than quietly inheriting it because
# nothing here ever said it shouldn't have it.
permissions:
  contents: read

jobs:
  shot3d:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tools/shot3d.js --gl swiftshader --sheet morphs morphs.png
      - run: node tools/shot3d.js --gl swiftshader --sheet pets pets.png
      - run: node tools/perf3d.js --gl swiftshader --budget 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheets
          path: |
            morphs.png
            pets.png
