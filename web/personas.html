<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Still Around — watch them</title>
<meta name="description" content="A cat and a dog, drawn live. Click them, or ask them to sit, walk, groom or nap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='52'>🐾</text></svg>">
<style>
  /* Only used on this page, so kept here rather than in style.css. */
  .persona-btn {
    padding: 8px 17px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-soft); font: inherit; font-family: var(--display);
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .persona-btn:hover { border-color: var(--peach); color: var(--accent-deep); transform: translateY(-2px); }

  .persona-stage {
    position: relative; border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4 / 3;
    cursor: pointer; border: 1px solid var(--line); box-shadow: var(--shadow-lg);
    background:
      radial-gradient(75% 46% at 50% 88%, var(--peach) 0%, rgba(255, 216, 198, 0) 72%),
      linear-gradient(180deg, #fff 0%, var(--cream) 100%);
  }
  .persona-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .persona-bubble {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); opacity: 0;
    pointer-events: none; background: #fff;
    border: 1px solid var(--line); color: var(--ink); font-size: 0.92rem; font-weight: 700;
    padding: 7px 15px; border-radius: 999px; white-space: nowrap; box-shadow: var(--shadow);
    transition: opacity 0.2s ease;
  }
  .persona-bar {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent);
    opacity: 0.45; transition: width 0.35s ease, opacity 0.4s ease;
  }
  .persona-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: clamp(22px, 3vw, 34px); margin-top: clamp(26px, 4vw, 40px);
  }
  .persona-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 2px 0; }
  .persona-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 18px 2px 0; }
  .persona-name h2 { font-size: 1.45rem; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="paw">🐾</span> Still <span>Around</span></a>
    <nav>
      <a href="index.html#get">Download</a>
      <a class="now" href="index.html#make">Make yours</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding-bottom:0">
  <div class="wrap">
    <h1 style="max-width:20ch">A cat and a dog, <em>drawn live</em>.</h1>
    <p class="lede" style="max-width:46ch">
      Click them. Or ask them to sit, walk, or curl up for a nap.
    </p>

    <div class="persona-grid">

      <article style="display:grid;align-content:start">
        <div class="persona-stage" id="cat-stage">
          <canvas id="cat-canvas"></canvas>
          <div class="persona-bubble" id="cat-bubble"></div>
          <div class="persona-bar" id="cat-bar"></div>
        </div>
        <div class="persona-name">
          <h2>The cat</h2>
          <span class="small muted">ginger tabby, white chest and socks</span>
        </div>
        <div class="persona-controls">
          <button class="persona-btn" id="cat-sit">Sit</button>
          <button class="persona-btn" id="cat-blink">Slow blink</button>
          <button class="persona-btn" id="cat-walk">Walk</button>
          <button class="persona-btn" id="cat-groom">Groom</button>
          <button class="persona-btn" id="cat-nap">Nap</button>
          <button class="persona-btn" id="cat-speak">Speak</button>
        </div>
      </article>

      <article style="display:grid;align-content:start">
        <div class="persona-stage" id="dog-stage">
          <canvas id="dog-canvas"></canvas>
          <div class="persona-bubble" id="dog-bubble"></div>
          <div class="persona-bar" id="dog-bar"></div>
        </div>
        <div class="persona-name">
          <h2>The dog</h2>
          <span class="small muted">tan, floppy ears, long legs</span>
        </div>
        <div class="persona-controls">
          <button class="persona-btn" id="dog-sit">Sit</button>
          <button class="persona-btn" id="dog-blink">Slow blink</button>
          <button class="persona-btn" id="dog-walk">Walk</button>
          <button class="persona-btn" id="dog-trot">Trot</button>
          <button class="persona-btn" id="dog-nap">Nap</button>
          <button class="persona-btn" id="dog-speak">Speak</button>
        </div>
      </article>

    </div>

    <div class="btn-row" style="margin-top:clamp(32px,5vw,48px);justify-content:center">
      <a class="btn btn-primary" href="index.html#make">Make yours →</a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="memorial">In memory of Momo &amp; Belle <span class="heart">🧡</span></div>
    <nav>
      <a href="index.html#privacy">Privacy</a>
      <a href="index.html#get">Download</a>
    </nav>
  </div>
</footer>

<script type="module" src="personas.js"></script>
</body>
</html>
